<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-Portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{--bg:#f5f2fa;--surface:#fff;--ink:#1d1530;--muted:#62587a;--line:#d9d2e8;--accent:#d6246e;--accent-ink:#fff;--alt:#0b7f92;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f24;--surface:#1f1733;--ink:#f1ecfb;--muted:#b1a6cc;--line:#352b50;--accent:#ff5c9d;--accent-ink:#150f24;--alt:#4fd1e3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150f24;--surface:#1f1733;--ink:#f1ecfb;--muted:#b1a6cc;--line:#352b50;--accent:#ff5c9d;--accent-ink:#150f24;--alt:#4fd1e3;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 Figtree,"Segoe UI",Arial,sans-serif;display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:1fr auto}
h1,h2,h3,.lbl,.stat b,.avatar,.steps li::before{font-family:Unbounded,"Segoe UI",Arial,sans-serif}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--alt);outline-offset:2px}
header{grid-column:1;grid-row:1/3;position:sticky;top:0;height:100vh;height:100dvh;border-right:2px solid var(--ink);padding-top:env(safe-area-inset-top,0px)}
nav{display:flex;flex-direction:column;gap:2px;padding:40px 0}
nav a{text-decoration:none;color:var(--muted);padding:10px 24px;font-weight:600;font-size:16px;border-left:5px solid transparent}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--accent);border-left-color:var(--accent);background:var(--surface)}
main{grid-column:2;max-width:860px;width:100%;padding:56px 40px 64px}
footer{grid-column:2;color:var(--muted);font-size:14px;padding:16px 40px 32px}
.hero{display:grid;grid-template-columns:220px 1fr;gap:44px;align-items:center;padding-bottom:16px}
.avatar{width:220px;height:220px;border-radius:30px;background:var(--surface);box-shadow:12px 12px 0 var(--accent);display:grid;place-items:center;font-weight:700;font-size:56px;color:var(--accent);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{font-size:clamp(28px,4.6vw,48px);line-height:1.08;margin:0 0 12px;font-weight:700;letter-spacing:-.02em}
h2{font-size:22px;margin:0 0 22px;font-weight:700}
h2::after{content:"";display:block;width:48px;height:5px;background:var(--accent);margin-top:10px;border-radius:3px}
h3{font-size:16px;margin:28px 0 10px;font-weight:700}
.sub{color:var(--alt);font-weight:600;margin:0 0 12px}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:11px 22px;border-radius:999px;text-decoration:none;font-weight:700;font-size:15px;border:2px solid var(--accent);margin:4px 6px 4px 0}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--ink)}
.sec{margin-top:52px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:22px;box-shadow:6px 6px 0 var(--line)}
.card h3{margin-top:0}
.card p{margin:0 0 12px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.tag{border:2px solid var(--alt);color:var(--ink);border-radius:999px;padding:2px 14px;font-size:14px;font-weight:600}
.lbl{font-weight:600;font-size:12px;color:var(--muted)}
.row{border-left:5px solid var(--alt);padding:2px 0 2px 18px;margin-bottom:24px}
.row b{font-size:18px}
.slot{border:2px dashed var(--muted);border-radius:18px;min-height:170px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:16px;font-size:15px}
.steps{list-style:none;padding:0;counter-reset:s}
.steps li{counter-increment:s;padding-left:50px;position:relative;margin-bottom:18px}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:14px;font-weight:700}
.stats{display:flex;flex-wrap:wrap;gap:14px}
.stat{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:14px 20px}
.stat b{display:block;font-size:24px;color:var(--alt)}
.video{aspect-ratio:16/9;border-radius:18px;background:var(--ink);color:var(--bg);display:grid;place-items:center;text-align:center;padding:16px}
@media (max-width:800px){body{display:block}header{position:sticky;top:0;height:auto;border-right:0;border-bottom:2px solid var(--ink);background:var(--bg);z-index:5}
nav{flex-direction:row;overflow-x:auto;padding:8px 12px}nav a{white-space:nowrap;border-left:0;border-bottom:4px solid transparent;padding:8px 12px}nav a[aria-current="page"]{border-bottom-color:var(--accent)}
main{padding:32px 18px}footer{text-align:center;padding:16px}.hero{grid-template-columns:1fr;justify-items:center;text-align:center;gap:32px}}
@media (prefers-reduced-motion:no-preference){.avatar{animation:pop .5s ease-out}@keyframes pop{from{transform:translate(8px,8px);box-shadow:0 0 0 var(--accent)}}}
</style>
</head>

    <h3>Education</h3>${rows(D.education)}<h3>Experience</h3>${rows(D.experience)}
    <h3>Relevant courses</h3>${li(D.courses)}
    <div class="grid sec"><div class="card"><h3>Technical skills</h3>${li(D.tech)}</div><div class="card"><h3>Transferable skills</h3>${li(D.soft)}</div></div>`,
  projects: () => `<h2>Projects</h2><div class="card"><span class="lbl">Personal project</span><h3>planeGame</h3>
    <p>A game project that I built and published on GitHub. The full source code is available in the repository.</p>
    <a class="btn" href="https://github.com/Tajwar774/planeGame" target="_blank" rel="noopener">View on GitHub</a></div>`,
  video: () => `<h2>Introduction video</h2><div class="video"><div>${D.videoUrl ? `<p>Watch my introduction</p><a class="btn" href="${esc(D.videoUrl)}" target="_blank" rel="noopener">Play video</a>` : `<p>Video coming soon. Add your link to <code>videoUrl</code>.</p>`}</div></div>
    <h3>What to say</h3><p>${esc(D.videoNote)}</p>`,
  contact: () => `<h2>Contact</h2><div class="card"><p><span class="lbl">Email</span><br><a href="mailto:${esc(D.email)}">${esc(D.email)}</a></p>
    <p><span class="lbl">Phone</span><br>${esc(D.phone)}</p><p><span class="lbl">Location</span><br>${esc(D.address)}</p>
    ${D.linkedin ? `<p><a href="${esc(D.linkedin)}">LinkedIn</a></p>` : ""}${D.github ? `<p><a href="${esc(D.github)}">GitHub</a></p>` : ""}</div>`
};
D.projects.forEach(p => pages[p.id] = () => `<h2>${esc(p.name)}</h2><p class="sub">${esc(p.type)} · ${esc(p.date)}</p><p>${esc(p.summary)}</p>
  <div class="card"><span class="lbl">My role</span><p>${esc(p.role)}</p><span class="lbl">Tools</span><br>${li(p.tools)}</div>
  <h3>Process and decisions</h3><ol class="steps">${p.steps.map(s=>`<li><b>${esc(s.h)}</b><br>${esc(s.d)}</li>`).join("")}</ol>
  <h3>Visuals</h3><div class="grid">${p.figures.map(f=>`<div class="slot">${esc(f)}</div>`).join("")}</div>
  <h3>Results</h3><div class="stats">${p.stats.map(s=>`<div class="stat"><b>${esc(s.n)}</b>${esc(s.l)}</div>`).join("")}</div>`);

function render(k){
  k = (k in pages) ? k : ((location.hash.slice(1) in pages) ? location.hash.slice(1) : "home");
  $("#nav").innerHTML = links.map(([id,t]) => `<a href="#${id}" ${id===k?'aria-current="page"':""}>${t}</a>`).join("");
  $("#view").innerHTML = pages[k]();
  document.title = (k==="home" ? "" : links.find(l=>l[0]===k)[1] + " | ") + D.name.replace(/[\[\]]/g,"");
  window.scrollTo(0,0);
}
$("#foot").textContent = "© 2026 " + D.name;
addEventListener("hashchange", () => render());
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if (!a) return;
  e.preventDefault();
  const k = a.getAttribute("href").slice(1);
  render(k);
  try { history.replaceState(null, "", "#" + k); } catch (x) {}
});
render();
</script>
</body>
</html>
